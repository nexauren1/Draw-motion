name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK structure, manifest, and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -t "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 5

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: drawmotion-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK filename
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "Drawmotion-${GITHUB_REF_NAME}-android.apk"

      - name: Publish APK on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Drawmotion ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          generate_release_notes: true
          files: Drawmotion-${{ github.ref_name }}-android.apk
